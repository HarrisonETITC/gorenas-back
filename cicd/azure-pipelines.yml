trigger: 
  branches:
    include:
      - master

pool: 'Laptop-Agent-Pool'

variables:
  - group: GENERAL

stages:
  - stage: Synchronize
    displayName: 'Synchronize Repositories'
    jobs:
      - job: SyncJob
        displayName: 'Sync To GitHub'
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - script: |
              echo "🔧 Git user is: $GITHUB_USER"
              echo "🔧 Git email is: $GITHUB_EMAIL"

              git config --global user.email "$GITHUB_EMAIL"
              git config --global user.name "$GITHUB_USER"
            displayName: 'Configure Git'
            env:
              GITHUB_USER: $(GITHUB_USER)
              GITHUB_EMAIL: $(GITHUB_EMAIL)

          - script: |
              echo "🔧 GitHub repo is: $GITHUB_REPO"
              echo "🔧 Current branch: $(Build.SourceBranchName)"

              if [[  -z "$GITHUB_TOKEN" ]]; then
                echo "❌ GITHUB_TOKEN is not set. Exiting."
                exit 1
              else
                echo "✅ GITHUB_TOKEN is set."
              fi

              # Add GitHub as a remote
              git remote add github https://$(GITHUB_TOKEN)@github.com/$GITHUB_USER/$GITHUB_REPO.git 2>/dev/null || git remote set-url github https://$(GITHUB_TOKEN)@github.com/$GITHUB_USER/$GITHUB_REPO.git
              
              # Get current branch name
              BRANCH_NAME=$(Build.SourceBranchName)
              
              echo "📤 Pushing branch $BRANCH_NAME to GitHub (force push)..."
              
              # Force push to GitHub - Azure DevOps is the source of truth
              git push --force github HEAD:$BRANCH_NAME
              
              echo "✅ Successfully synchronized branch $BRANCH_NAME to GitHub"
            displayName: 'Sync to GitHub'
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
              GITHUB_REPO: $(Build.Repository.Name)
              GITHUB_USER: $(GITHUB_USER)
              
  - stage: CleanUp
    displayName: 'Clean Up'
    dependsOn: [Synchronize]
    jobs:
      - job: CleanupJob
        displayName: 'Clean Workspace'
        condition: always()
        steps:
          - script: |
              echo "Limpiando workspace completo..."
              rm -rf $(Pipeline.Workspace)/*
              echo "Limpieza completada"
            displayName: 'Clean all workspace'
