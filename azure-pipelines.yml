# Azure DevOps Pipeline para despliegue y seeding de base de datos
# azure-pipelines.yml

trigger: none

pool: 'Laptop-Agent-Pool'

variables:
  - group: GENERAL

stages:
  - stage: Build
    displayName: 'Build Application'
    jobs:
      - job: BuildJob
        displayName: 'Build and Test'
        steps:
          - checkout: self
          - script: |
              node -v
              npm -v
              if ! command -v pnpm &> /dev/null; then
                echo "Instalando pnpm..."
                npm install -g pnpm
              else
                echo "pnpm ya está instalado"

                pnpm -v
              fi
            displayName: 'Verify Nodejs & pnpm'

          - script: |
              pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          - script: |
              pnpm run build
            displayName: 'Build project'

          - script: |
              pnpm run test:cov
            displayName: 'Run tests with coverage'
            continueOnError: true

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)/coverage'
              mergeTestResults: true
              failTaskOnFailedTests: false
              testRunTitle: 'Unit Tests'
            condition: always()
            displayName: 'Publish test results'

          # - task: PublishCodeCoverageResults@1
          #   inputs:
          #     codeCoverageTool: 'Cobertura'
          #     summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
          #     reportDirectory: '$(System.DefaultWorkingDirectory)/coverage'
          #     failIfCoverageEmpty: false
          #   condition: always()
          #   displayName: 'Publish code coverage'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'dist'
              ArtifactName: 'dist'
            displayName: 'Publish dist artifact'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'node_modules'
              ArtifactName: 'node_modules'
            displayName: 'Publish node_modules artifact'

          - script: |
              echo "Cleaning up workspace..."
              rm -rf $(Pipeline.Workspace)/*
            displayName: 'Clean Workspace'

  # ============================================
  # STAGE: Deploy to Development
  # ============================================
  - stage: DeployDev
    displayName: 'Deploy to Development'
    dependsOn: Build
    condition: and(eq(variables['Build.SourceBranch'], 'refs/heads/develop'))
    jobs:
      - deployment: DeployDevJob
        displayName: 'Deploy to Dev Environment'
        environment: 'development'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: dist

                - download: current
                  artifact: node_modules

                - script: |
                    echo "🌱 Running database seeder for Development..."
                    # node $(Pipeline.Workspace)/dist/src/Infraestructure/orm/typeorm/seeders/config/run-seed.js
                    echo $(DB_HOST)
                    echo $(DB_PORT)
                    echo $(DB_USER)
                    echo $(DB_NAME)
                  displayName: 'Seed Development Database'
                  env:
                    DB_HOST: $(DB_HOST)
                    DB_PORT: $(DB_PORT)
                    DB_USER: $(DB_USER)
                    DB_PASS: $(DB_PASS)
                    DB_NAME: $(DB_NAME)
                    ENVIRONMENT: dev
                    NODE_PATH: $(Pipeline.Workspace)/node_modules

