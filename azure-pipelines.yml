# Azure DevOps Pipeline para despliegue y seeding de base de datos
# azure-pipelines.yml

trigger: none

pool: 'Laptop-Agent-Pool'

variables:
  - group: GENERAL

stages:
  - stage: Build
    displayName: 'Build Application'
    jobs:
      - job: BuildJob
        displayName: 'Build and Test'
        steps:
          - checkout: self
          - script: |
              node -v
              npm -v
              if ! command -v pnpm &> /dev/null; then
                echo "Instalando pnpm..."
                npm install -g pnpm
              else
                echo "pnpm ya está instalado"

                pnpm -v
              fi
            displayName: 'Verify Nodejs & pnpm'

          - script: |
              pnpm install --frozen-lockfile
            displayName: 'Install dependencies'

          - script: |
              pnpm run build
            displayName: 'Build project'

          - script: |
              pnpm run test:cov
            displayName: 'Run tests with coverage'
            continueOnError: true

          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/junit.xml'
              searchFolder: '$(System.DefaultWorkingDirectory)/coverage'
              mergeTestResults: true
              failTaskOnFailedTests: false
              testRunTitle: 'Unit Tests'
            condition: always()
            displayName: 'Publish test results'

          - script: |
              cd dist
              zip -r ../dist.zip .
            displayName: 'Zip dist folder for Publishment'

          # - task: PublishCodeCoverageResults@1
          #   inputs:
          #     codeCoverageTool: 'Cobertura'
          #     summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage/cobertura-coverage.xml'
          #     reportDirectory: '$(System.DefaultWorkingDirectory)/coverage'
          #     failIfCoverageEmpty: false
          #   condition: always()
          #   displayName: 'Publish code coverage'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: 'dist.zip'
              ArtifactName: 'dist'
            displayName: 'Publish dist.zip artifact'

          - task: CopyFiles@2
            inputs:
              Contents: |
                package.json
                pnpm-lock.yaml
              TargetFolder: '$(Build.ArtifactStagingDirectory)/package-files'
            displayName: 'Copy package files'

          - task: PublishBuildArtifacts@1
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/package-files'
              ArtifactName: 'package-files'
            displayName: 'Publish package files'

  # ============================================
  # STAGE: Deploy to Development
  # ============================================
  - stage: DeployDev
    displayName: 'Deploy Project'
    dependsOn: Build
    condition: eq(variables['Build.SourceBranch'], 'refs/heads/develop')
    jobs:
      - job: DatabaseUpdate
        displayName: 'Database Update Job'
        steps:
          - download: current
            artifact: dist
            displayName: 'Download dist artifact'

          - download: current
            artifact: package-files
            displayName: 'Download package files artifact'

          - task: DownloadSecureFile@1
            name: MainDataDb
            inputs:
              secureFile: 'database_init_data'

          - script: |
              ls -la

              cp $(Pipeline.Workspace)/dist/dist.zip .

              unzip dist.zip -d dist

              ls -la

              pwd
            displayName: 'Unzip dist artifact'

          - script: |
              cp $(Pipeline.Workspace)/package-files/package.json .
              cp $(Pipeline.Workspace)/package-files/pnpm-lock.yaml .
              pnpm install --frozen-lockfile --prod
            displayName: 'Install production dependencies'

          - script: |
              echo "Searching MySQL migrations folder"
              MIGRATIONS_FOLDER=$(find . -type d -path "*/dist/*/migrations/mysql")
              echo "Migrations folder found: $MIGRATIONS_FOLDER"
              echo "🌱 Copying initial data file to Migrations folder..."
              cp $(MainDataDb.secureFilePath) $MIGRATIONS_FOLDER/data.sql
              ls -la $MIGRATIONS_FOLDER

              echo "##vso[task.setvariable variable=MIGRATIONS_FOLDER]$MIGRATIONS_FOLDER"
            displayName: 'Copy initial data file to MySQL Migrations folder'

          - script: |
              echo "🌱 Migration folder is: $(MIGRATIONS_FOLDER)"
              echo "🌱 Database name is: $DB_NAME"
              echo "🌱 Seeding database name in data.sql file..."
              sed -i "s/database_name/$DB_NAME/g" $MIGRATIONS_FOLDER/data.sql
            displayName: 'Seed Database Name in data.sql file'
            env:
              MIGRATIONS_FOLDER: $(MIGRATIONS_FOLDER)
              DB_NAME: $(DB_NAME)

          - script: |
              echo "🌱 Executing database migration..."
              pnpm run migration:run
            displayName: 'Execute database migration'
            env:
              DB_HOST: $(DB_HOST)
              DB_PORT: $(DB_PORT)
              DB_USER: $(DB_USER)
              DB_PASS: $(DB_PASS)
              DB_NAME: $(DB_NAME)
              ENVIRONMENT: dev1

          - script: |
              echo "🌱 Cleaning up initial data file from Migrations folder..."
              rm -f $MIGRATIONS_FOLDER/data.sql
            displayName: 'Clean up initial data file from Migrations folder'

      - deployment: DeployDevJob
        displayName: 'Deploy to Development'
        dependsOn: DatabaseUpdate
        condition: and(not(canceled()), succeeded())
        environment: 'development'
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    echo "🔧 Seenode Application ID is: $SEENODE_APPLICATION_ID"

                    if [[ -z "$SEENODE_API_TOKEN" ]]; then
                      echo "❌ SEENODE_API_TOKEN is not set. Exiting."
                      exit 1
                    else
                      echo "✅ SEENODE_API_TOKEN is set."
                    fi

                    echo "🔄 Updating Gorenas in Seenode..."
                    curl -X POST \
                      -H "Authorization: Bearer $SEENODE_API_TOKEN" \
                      -H "Content-Type: application/json" \
                      -d '{"gitCommitSha": "$(Build.SourceVersion)"}' \
                      "https://api.seenode.com/v1/applications/$SEENODE_APPLICATION_ID/deployments"
                  displayName: 'Send Deploy Trigger to Seenode'
                  env:
                    SEENODE_API_TOKEN: $(SEENODE_API_TOKEN)
                    SEENODE_APPLICATION_ID: $(SEENODE_APPLICATION_ID)
      - job: RollBackJob
        displayName: 'Rollback Job'
        dependsOn: [DatabaseUpdate, DeployDevJob]
        condition: failed()
        steps:
          - script: |
              echo "🌱 Rolling back database migration"
              # pnpm run migration:revert
            displayName: 'RollBack database migration'
            env:
              DB_HOST: $(DB_HOST)
              DB_PORT: $(DB_PORT)
              DB_USER: $(DB_USER)
              DB_PASS: $(DB_PASS)
              DB_NAME: $(DB_NAME)
              ENVIRONMENT: dev1
              
  - stage: CleanUp
    displayName: 'Clean Up'
    dependsOn: [Build, DeployDev]
    jobs:
      - job: CleanupJob
        displayName: 'Clean Workspace'
        condition: always()
        steps:
          - script: |
              echo "Limpiando workspace completo..."
              rm -rf $(Pipeline.Workspace)/*
              echo "Limpieza completada"
            displayName: 'Clean all workspace'
